name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; let the latest finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          # Built-in Swatinem/rust-cache keeps target/ + cargo registry warm
          cache: true

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM (release profile via wasm-pack default)
        run: wasm-pack build crates/viz-core --target web --out-dir pkg

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Build static site
        env:
          # Vite serves under https://<user>.github.io/math-visualizer/
          BASE_PATH: /math-visualizer/
        run: npm run build
        working-directory: web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

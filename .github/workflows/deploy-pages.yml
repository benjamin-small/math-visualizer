name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; let the latest finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          # Built-in Swatinem/rust-cache keeps target/ + cargo registry warm
          cache: true

      - name: Install wasm-pack
        # Pinned and unpacked straight into ~/.cargo/bin: jetli/wasm-pack-action moves the binary
        # across filesystems, which the runner now refuses (EXDEV).
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin" --strip-components=1 "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          wasm-pack --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM (release profile via wasm-pack default)
        run: wasm-pack build crates/viz-core --target web --out-dir pkg

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Build static site
        env:
          # Vite serves under https://<user>.github.io/math-visualizer/
          BASE_PATH: /math-visualizer/
        run: npm run build
        working-directory: web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
